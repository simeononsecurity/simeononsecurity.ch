<path d="M1175 475 L1175 551" stroke="#56c9be" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M850 690 L744 690" stroke="#56c9be" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="80" y="225" width="650" height="250" rx="18" fill="#1d304a" stroke="#4e729a" stroke-width="2"/>
<text x="110" y="278" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#78dcd0">1  SERVICE BASELINE</text>
<text x="110" y="333" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Exact name, path, and account</text>
<text x="110" y="378" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Startup mode and dependencies</text>
<text x="110" y="423" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Original or newly created object</text>
<rect x="850" y="225" width="650" height="250" rx="18" fill="#1d304a" stroke="#4e729a" stroke-width="2"/>
<text x="880" y="278" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#78dcd0">2  APPROVED TRIGGER</text>
<text x="880" y="333" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Expected one-shot or continuous life</text>
<text x="880" y="378" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Permitted start and stop behavior</text>
<text x="880" y="423" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Defined observation window</text>
<rect x="80" y="565" width="650" height="250" rx="18" fill="#1d304a" stroke="#4e729a" stroke-width="2"/>
<text x="110" y="618" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#78dcd0">4  VERIFIED RESTORATION</text>
<text x="110" y="673" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Restore changes or remove owned items</text>
<text x="110" y="718" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Check service and process state</text>
<text x="110" y="763" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Preserve review evidence</text>
<rect x="850" y="565" width="650" height="250" rx="18" fill="#1d304a" stroke="#4e729a" stroke-width="2"/>
<text x="880" y="618" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#78dcd0">3  RUNTIME EVIDENCE</text>
<text x="880" y="673" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">SCM state and process instance</text>
<text x="880" y="718" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Identity, architecture, and timing</text>
<text x="880" y="763" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">Task result and transport state</text>
<rect x="80" y="885" width="1420" height="65" rx="12" fill="#263951"/>
<text x="104" y="927" font-family="Arial, sans-serif" font-size="25" font-weight="normal" fill="#f2d295">A stopped service only makes sense when compared with its intended lifecycle</text>
