<text x="80" y="95" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">Separate the BOF execution responsibilities</text>
<text x="80" y="148" font-family="Arial, sans-serif" font-size="27" font-weight="normal" fill="#dce6f2">A registered command, compatible object, and correct result establish different facts.</text>
