<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Offline</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3f51b5">
    <link rel="manifest" href="/manifest.json">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        -webkit-font-smoothing: antialiased;
      }
      img {
        display: block;
        margin-left: auto;
        margin-right: auto;
      }
      h1, div {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Small inline SVG icon (a few hundred bytes) instead of the previous
         inline base64 PNG (~36KB). offline.html is force-fetched by the
         service worker SHELL_ASSETS precache on every SW install, so its
         weight multiplies by every first-time visitor. The old inline PNG
         alone accounted for an estimated 5-6GB/week of site bandwidth.
         Fixed 2026-09. -->
    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z" fill="#3f51b5"/>
      <path d="M5 13l2 2a7.07 7.07 0 0 1 10 0l2-2a10.1 10.1 0 0 0-14 0z" fill="#3f51b5"/>
      <path d="M9 17l2 2a3.13 3.13 0 0 1 2 0l2-2a5.02 5.02 0 0 0-6 0z" fill="#3f51b5"/>
      <line x1="1" y1="1" x2="23" y2="23" stroke="#e53935" stroke-width="2"/>
    </svg>
    <h1>Offline</h1>
  </body>
</html>
