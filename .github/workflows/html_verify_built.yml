name: HTML Validation

on:
  push:
    branches:
      - 'website-en-alt'
      - 'website-en'
      - 'website-it'
      - 'website-nl'
      - 'website-fr'
      - 'website-es'
      - 'website-de'
      - 'website-ja'
      - 'website-pl'
      - 'website-bn'
      - 'website-ru'
      - 'website-pt'
      - 'website-ca'
      - 'website-zh'
      - 'website-pa'
      - 'website-ar'
      - 'website-hi'
      - 'website-ro'
  pull_request:
    branches:
      - 'website-en-alt'
      - 'website-en'
      - 'website-it'
      - 'website-nl'
      - 'website-fr'
      - 'website-es'
      - 'website-de'
      - 'website-ja'
      - 'website-pl'
      - 'website-bn'
      - 'website-ru'
      - 'website-pt'
      - 'website-ca'
      - 'website-zh'
      - 'website-pa'
      - 'website-ar'
      - 'website-hi'
      - 'website-ro'

jobs:
  html_validation_job:
    name: HTML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: HTML5 Validator
        uses: Cyb3r-Jak3/html5validator-action@41633d488eb36e18fd1a95ffc83daf1bf22a75bd # v7.2.0
        with:
          root: .