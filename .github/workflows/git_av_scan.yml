name: Git AV Scan

on:
  push:
    branches:
      - master

jobs:
  gitavscan:
    runs-on: ubuntu-latest
    name: History AV Scan
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: '0'
    
    - name: Git AV Scan
      uses: djdefi/gitavscan@66a83ba98eca422f37322bc9851fa56195b252f3 # v23
