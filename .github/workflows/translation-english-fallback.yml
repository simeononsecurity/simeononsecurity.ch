name: Translation English Fallback Check

on:
  push:
    paths:
      - "content/articles/**/index.*.md"
      - "config/_default/config.toml"
      - "tools/check_translation_english_leakage.py"
      - "tools/test_translation_english_leakage.py"
      - ".github/workflows/translation-english-fallback.yml"
  pull_request:
    paths:
      - "content/articles/**/index.*.md"
      - "config/_default/config.toml"
      - "tools/check_translation_english_leakage.py"
      - "tools/test_translation_english_leakage.py"
      - ".github/workflows/translation-english-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation-english-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the translation fallback checker
        run: python3 tools/test_translation_english_leakage.py

      - name: Block incomplete translations in changed article bundles
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="origin/$DEFAULT_BRANCH"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          changed_output="$(git diff --name-only "$base_sha" "$HEAD_SHA" -- content/articles/)"
          changed_paths=()
          if [[ -n "$changed_output" ]]; then
            mapfile -t changed_paths <<< "$changed_output"
          fi
          bundles=()
          for path in "${changed_paths[@]}"; do
            [[ "$path" == content/articles/* ]] || continue
            bundle_dir="${path%/*}"
            while [[ "$bundle_dir" == content/articles/* ]]; do
              if git cat-file -e "$HEAD_SHA:$bundle_dir/index.en.md" 2>/dev/null; then
                bundles+=("$bundle_dir")
                break
              fi
              [[ "$bundle_dir" == content/articles ]] && break
              bundle_dir="${bundle_dir%/*}"
            done
          done

          if ((${#bundles[@]} > 0)); then
            mapfile -t bundles < <(printf '%s\n' "${bundles[@]}" | sort -u)
          fi

          if ((${#bundles[@]} == 0)); then
            echo "No article bundles changed in this event."
            exit 0
          fi

          python3 tools/check_translation_english_leakage.py --fail-on-english-fallback "${bundles[@]}"

      - name: Block copied or English-dominant translation bodies
        run: python3 tools/check_translation_english_leakage.py --all --fail-on-english-body-fallback
