# HUGO_ENV = "production"
# HUGO_ENABLEGITINFO = "true"
# NODE_VERSION = "18.16.0"
#NPM_FLAGS = "npm install --save-dev -g -D babel/cli babel/core babel/preset-env browserslist clipboard cssnano postcss postcss-cli postcss-import postcss-mixins postcss-nested postcss-preset-env postcss-url hugo-extended eslint-plugin-import eslint-plugin-react eslint-plugin-react-hooks eslint-plugin-import fsevents jimp lru-cache @ampproject/toolbox-optimizer"
#NPM_FLAGS = "npm install --save-dev -g -D @babel/cli @babel/core @babel/preset-env babel/babel browserslist clipboard cssnano postcss postcss-cli postcss-import postcss-mixins postcss-nested postcss-preset-env postcss-url hugo-extended eslint-plugin-import eslint-plugin-react eslint-plugin-react-hooks eslint-plugin-import jimp lru-cache @ampproject/toolbox-optimizer"

[[headers]]
# Security-contact/policy content should stay revalidatable in case a key or
# policy needs an urgent update, so this is no longer a blind 1-year browser
# cache with zero revalidation trigger.
for = "/securityheaders*"
[headers.values]
Cache-Control = "public, s-maxage=604800, max-age=3600, must-revalidate"
Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
# XML feeds (sitemap.xml, index.xml, news.xml, rssall.xml, smartnews.xml,
# imagessitemap.xml, fulltext.xml) were previously "no-cache, no-store,
# must-revalidate", forcing a full origin refetch on every single crawler
# hit. Bot/crawler traffic re-polls these repeatedly (confirmed ~440MB/week
# of repeat-hit bandwidth). A 30-minute edge cache absorbs that repeat load
# while still keeping propagation delay short enough for time-sensitive feeds
# like news.xml (Google re-polls periodically, not in real time anyway).
# must-revalidate ensures nothing is served past the TTL without checking.
for = "/*.xml"
[headers.values]
Cache-Control = "public, s-maxage=1800, max-age=300, must-revalidate"
Access-Control-Allow-Origin = "*"

[[headers]]
# Quiz question-bank JSON files (up to ~400KB each) are static and only change
# when a bank is manually regenerated. Cache aggressively at the edge/CDN and
# browser to cut repeat-fetch bandwidth on every practice-test page load, while
# still revalidating daily so a corrected bank propagates within 24 hours.
for = "/quiz-dicts/*"
[headers.values]
Cache-Control = "public, max-age=86400, s-maxage=604800, must-revalidate"
Access-Control-Allow-Origin = "*"
Content-Type = "application/json"

[[headers]]
for = "/tags/*"
[headers.values]
X-Robots-Tag = "noindex, follow"

[[headers]]
for = "/categories/*"
[headers.values]
X-Robots-Tag = "noindex, follow"

[[headers]]
for = "/admin/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
# Previously had no s-maxage at all, so Cloudflare's edge had no explicit
# origin cache guidance for direct .html/.htm requests and had to fall back
# to its own default heuristics (or the generic /* catch-all further below).
# 1-hour edge + 1-hour browser keeps content reasonably fresh while cutting
# repeat-origin-hit traffic within that window.
for = "/*.html"
[headers.values]
Cache-Control = "public, s-maxage=3600, max-age=3600, must-revalidate"

[[headers]]
for = "/*.htm"
[headers.values]
Cache-Control = "public, s-maxage=3600, max-age=3600, must-revalidate"

[[headers]]
for = "/img/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"

[[headers]]
for = "/*.jpeg"
[headers.values]
Access-Control-Allow-Origin = "*"
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Content-Type = "image/jpeg"

[[headers]]
for = "/*.png"
[headers.values]
Access-Control-Allow-Origin = "*"
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Content-Type = "image/png"

[[headers]]
for = "/*.webp"
[headers.values]
Access-Control-Allow-Origin = "*"
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Content-Type = "image/webp"

[[headers]]
for = "/*.ico"
[headers.values]
Access-Control-Allow-Origin = "*"
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Content-Type = "image/x-icon"

[[headers]]
# main.js, prism.js, and style-append.css are served from stable (non-fingerprinted)
# paths, so they are NOT marked immutable. Browser max-age matched down to the
# same 30-day edge s-maxage (previously max-age=31536000 while s-maxage was
# only 2592000, an inverted pair where the browser cached a mutable, editable
# file 12x longer than the edge did). must-revalidate still forces a
# conditional GET once the 30 days elapse, so a fix reaches every client
# within 30 days worst case instead of up to a year.
for = "/*.css"
[headers.values]
Cache-Control = "public, s-maxage=2592000, max-age=2592000, must-revalidate"
Access-Control-Allow-Origin = "*"
Content-Type = "text/css"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, s-maxage=2592000, max-age=2592000, must-revalidate"
Access-Control-Allow-Origin = "*"
Content-Type = "application/javascript"

[[headers]]
# Previously had no s-maxage at all (edge had no explicit origin guidance).
# This rule also covers /index.json, the ~9.4MB full-site search index
# fetched by static/js/search.js on every search query, so a slightly longer
# TTL than the old 1-hour cuts real repeat-fetch bandwidth; must-revalidate
# still guarantees a stale copy is never served past the TTL.
for = "/*.json"
[headers.values]
Cache-Control = "public, s-maxage=3600, max-age=3600, must-revalidate"
Access-Control-Allow-Origin = "*"
Content-Type = "application/json"

[[headers]]
# Aligned browser max-age down to the same 7-day window as s-maxage, matching
# the pattern used by every other immutable/fingerprint-adjacent rule in this
# file (1yr/1yr or, here, 7d/7d) instead of the previous mismatched 7d edge /
# 1yr browser split.
for = "/*.mjs"
[headers.values]
Cache-Control = "public, immutable, s-maxage=604800, max-age=604800"
Content-Type = "text/javascript"

[[headers]]
for = "/*.sass"
[headers.values]
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Content-Type = "text/x-sass"

[[headers]]
for = "/*.scss"
[headers.values]
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Content-Type = "text/x-scss"

[[headers]]
for = "/*.less"
[headers.values]
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Content-Type = "text/x-less"

[[headers]]
for = "/*.wasm"
[headers.values]
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Content-Type = "application/wasm"

[[headers]]
# Downloadable files (scripts, docs) are versioned by filename change, not
# in-place edits, so a longer edge cache is safe. must-revalidate still keeps
# a stale local copy from being served if a file is removed or replaced.
for = "/*.pdf"
[headers.values]
Cache-Control = "public, must-revalidate, s-maxage=31536000, max-age=31536000"
Content-Type = "application/pdf"

[[headers]]
for = "/*.doc"
[headers.values]
Cache-Control = "public, must-revalidate, s-maxage=31536000, max-age=31536000"
Content-Type = "application/msword"

[[headers]]
for = "/*.xls"
[headers.values]
Cache-Control = "public, must-revalidate, s-maxage=31536000, max-age=31536000"
Content-Type = "application/vnd.ms-excel"

[[headers]]
# Previously had no s-maxage at all (edge had no explicit origin guidance).
for = "/*.frag"
[headers.values]
Cache-Control = "public, s-maxage=3600, max-age=3600, must-revalidate"
Content-Type = "text/plain"

[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Access-Control-Allow-Origin = "*"
Vary = "Origin"

 [[headers]]
for = "/*.woff2"
[headers.values]
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"
Access-Control-Allow-Origin = "*"
Vary = "Origin"

[[headers]]
for = "/audio/*"
[headers.values]
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"

[[headers]]
for = "/videos/*"
[headers.values]
Cache-Control = "public, immutable, s-maxage=31536000, max-age=31536000"

[[headers]]
for = "/sse/*"
[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

## HEADERS
[[headers]]
# Define which paths this specific [[headers]] block will cover.
# This is the catch-all that governs every pretty-URL content page (articles,
# guides, the homepage, section/tag list pages) since Hugo's clean URLs
# (/articles/foo/) don't match the /*.html rule above (that only matches
# literal .html paths, not directory-style URLs). Previously this had
# max-age=31536000 (1yr browser) with s-maxage=604800 (7d edge) and NO
# must-revalidate, an inverted pair that let a returning visitor's browser
# serve a stale article for up to a year with no forced check-back even
# after content was edited and lastmod bumped. Both TTLs brought down to a
# much more reasonable window and must-revalidate added so a stale copy is
# never served past its TTL without at least a conditional GET (a cheap 304
# if nothing changed, not a full re-download).
for = "/*"

[headers.values]
Access-Control-Allow-Origin = "https://simeononsecurity.com"
Cache-Control = "public, s-maxage=86400, max-age=3600, must-revalidate"
Permissions-Policy = "sync-xhr=(self), accelerometer=(), camera=(), display-capture=(), geolocation=(), microphone=(), midi=(), payment=(), usb=(), gyroscope=(), magnetometer=(), screen-wake-lock=(), xr-spatial-tracking=()"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
Upgrade-Insecure-Requests = "1"
Referrer-Policy = "strict-origin-when-cross-origin"
X-DNS-Prefetch-Control = "active"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "sameorigin"
X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
X-Xss-Protection = "1; mode=block"
Content-Security-Policy = "default-src 'self' https://simeononsecurity.ch https://simeononsecurity.com https://*.simeononsecurity.ch https://*.simeononsecurity.com https://*.cloudfront.net https://ajax.cloudflare.com https://raw.githubusercontent.com https://nominatim.openstreetmap.org 'unsafe-inline' https: data:; script-src 'self' https://simeononsecurity.ch https://simeononsecurity.com https://*.simeononsecurity.ch https://*.simeononsecurity.com https://*.googlesyndication.com https://*.amazon-adsystem.com https://cdnjs.cloudflare.com/ https://*.cloudfront.net https://ajax.cloudflare.com https://raw.githubusercontent.com https://ws-na.amazon-adsystem.com https://www.google-analytics.com/ https://cdn.ampproject.org https://cdn.jsdelivr.net https://*.gstatic.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://googletagservices.com https://stats.g.doubleclick.net https://utteranc.es https://*.utteranc.es https://pagead2.googlesyndication.com https://go.ezoic.net https://static.cloudflareinsights.com https://resources.infoLinks.com https://www.clarity.ms https://nominatim.openstreetmap.org 'unsafe-inline' 'unsafe-eval' https: data:; font-src 'self' data: https: https://fonts.gstatic.com https://*.cloudfront.net https://simeononsecurity.ch https://simeononsecurity.com https://*.simeononsecurity.ch https://*.simeononsecurity.com ; object-src 'none'; img-src 'self' data: https: https://*.cloudfront.net https://raw.githubusercontent.com; frame-src 'self' https: data: https://googleads.g.doubleclick.net https://stats.g.doubleclick.net https://ws-na.amazon-adsystem.com https://www.youtube.com; upgrade-insecure-requests; frame-ancestors 'none'"
Cross-Origin-Opener-Policy-Report-Only = 'unsafe-none; report-to="default"'
Cross-Origin-Opener-Policy = 'unsafe-none; report-to="default"'
Cross-Origin-Embedder-Policy-Report-Only = 'unsafe-none; report-to="default"'
Cross-Origin-Embedder-Policy = 'unsafe-none; report-to="default"'
Cross-Origin-Resource-Policy = "cross-origin"
Server = "simeononsecurity"
pagespeed = "on"
Vary = "Origin"

