name: test-python-starter

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q app.py
      - name: Test
        run: python -m unittest -v test_app.py
