<style>
  /* ── Donate / sponsor CTA ──────────────────────────────────────────
     Every floating ad partial (stscollective, eyespy, rayhunter,
     flockyou, signalandsteel, audible, bitdefender, presearch, ...)
     renders at the identical position: fixed; bottom: 20px; left: 20px;
     z-index: 9999 on viewports >= 901px. Without an offset this button
     stacks directly on top of those ads and one of the two becomes
     unclickable. Below 901px the ad partials hide themselves, so the
     20px slot is free and this button can safely sit there. */
  .sponsor-button {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 9999;
    max-width: min(320px, calc(100vw - 40px));
  }

  @media (min-width: 901px) {
    .sponsor-button {
      /* Clears the ~255x212 ad image + its CTA strip (~260px tall
         total) plus a 16px gap, so the two CTAs never overlap. */
      bottom: 296px;
    }
  }

  .sponsor-button-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    background-color: #fe5186;
    color: #fff;
    padding: 12px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.88rem;
    line-height: 1.3;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 14px rgba(254, 81, 134, 0.45);
    transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .sponsor-button-link:hover {
    background-color: #ff6b9c;
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(254, 81, 134, 0.6);
  }

  .sponsor-button-link:active {
    transform: translateY(0);
    box-shadow: 0 3px 10px rgba(254, 81, 134, 0.45);
  }

  .sponsor-button-link:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }

  .sponsor-button-link .sponsor-button-icon {
    flex-shrink: 0;
    font-size: 1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .sponsor-button-link {
      transition: none;
    }
    .sponsor-button-link:hover,
    .sponsor-button-link:active {
      transform: none;
    }
  }

  /* Smaller, tighter CTA on phones so the long i18n label never pushes
     the fixed-position button past the viewport edge. */
  @media (max-width: 767px) {
    .sponsor-button-link {
      padding: 10px 16px;
      font-size: 0.8rem;
    }
  }
</style>

<div class="sponsor-button">
  <a
    href="https://github.com/sponsors/simeononsecurity"
    target="_blank"
    itemprop="url"
    aria-label="{{ i18n "support_button_text" }}"
    class="sponsor-button-link"
  >
    <i class="fa-solid fa-heart sponsor-button-icon" aria-hidden="true"></i>
    <span itemprop="name">
      {{ i18n "support_button_text" }}
    </span>
  </a>
</div>
<script>
  // Function to handle gtag event tracking
  function sendTrackingEvent(linkUrl) {
    try {
      gtag('event', 'click', {
        'event_category': 'Sponsor Button Click',
        'event_label': linkUrl,
        'event_callback': function () {
          window.location.href = linkUrl;
        }
      });
    } catch (error) {
      console.error('Error sending gtag event:', error);
      window.location.href = linkUrl;
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var trackingLinks = document.querySelectorAll('.sponsor-button-link');
    trackingLinks.forEach(function (link) {
      link.addEventListener('click', function (event) {
        event.preventDefault();
        var linkUrl = this.href;
        window.location.href = linkUrl;        yieldToMain(function() {
          sendTrackingEvent(linkUrl);
        }, "background");
      });
    });
  });
</script>
