{{/* extended_head.html — loaded last in <head> by the theme's head.html
     This overrides the theme's version; keep the original content intact
     and add site-specific SEO + PWA additions at the top.
*/}}

<!-- ── SEO: canonical URL ─────────────────────────────────────────────── -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- ── PWA: theme-color for light / dark mode ────────────────────────── -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161617">
<meta name="color-scheme" content="light dark">

<!-- ── Author meta ───────────────────────────────────────────────────── -->
<meta name="author" content="{{ with .Params.Author }}{{ . }}{{ else }}SimeonOnSecurity{{ end }}">

<!-- ── Service-worker link prefetcher: idle + hover-intent caching ───── -->
<script defer src="/js/sw-prefetch.js"></script>

<!-- ── DNS prefetch for the lite-youtube web component's video host ──── -->
<link rel="dns-prefetch" href="//www.youtube-nocookie.com">

<!-- ── Original theme content (render-alternates, manifest, icons) ───── -->
{{ partialCached "render-alternates.html" . .Page .Page.Page .Site.Language.Lang .Language.Lang }}

<link rel="manifest" href="{{ ("manifest.json" | absURL) }}">

<link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ "img/apple-touch-icon-144-precomposed.png" | absURL }}" />
<link rel="apple-touch-icon" sizes="192x192" href="{{ "img/apple-touch-icon-192.png" | absURL }}" />
<link rel="icon" type="image/png" sizes="144x144" href="{{ "img/apple-touch-icon-144-precomposed.png" | absURL }}" >
<link rel="icon" type="image/png" sizes="192x192" href="{{ "img/apple-touch-icon-192.png" | absURL }}" >
<link rel="shortcut icon" href="{{ "img/favicon.png" | absURL }}" />
<link rel="icon" type="image/png" sizes="32x32" href="{{ "img/favicon.png" | absURL }}" />
