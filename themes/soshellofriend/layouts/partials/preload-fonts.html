<!-- first-party fonts -->
<!-- Preload critical fonts with low importance -->
<!-- The @font-face rules that actually render page text live in style-base.css
     (inlined into every page via prepended_head.html) and reference
     /assets/fonts/Inter-*.woff2. This preload MUST use that same path, or the
     browser force-fetches two extra font files on every page load that are
     never applied to any rendered text (confirmed: no @font-face anywhere
     references bare /fonts/Inter-*.woff2). Fixed 2026-09: this was previously
     preloading /fonts/Inter-Regular.woff2 and /fonts/Inter-Bold.woff2, a dead
     path with no consumer, which was pure wasted bandwidth on every request. -->
<link rel="preload" href="/assets/fonts/Inter-Regular.woff2" as="font"  type="font/woff2" media="(min-width: 769px)" fetchpriority="high">
<link rel="preload" href="/assets/fonts/Inter-Bold.woff2" as="font" type="font/woff2" media="(min-width: 769px)" fetchpriority="high">
